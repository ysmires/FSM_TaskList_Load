<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel → ZIP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; min-height: 100vh; background: #f5f5f4; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 480px; }
    .logo { width: 40px; height: 40px; background: #4f46e5; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
    h1 { font-size: 20px; font-weight: 600; color: #111; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #6b7280; margin-bottom: 2rem; line-height: 1.5; }
    .steps { display: flex; align-items: center; margin-bottom: 2rem; }
    .step { text-align: center; }
    .step-num { width: 26px; height: 26px; border-radius: 50%; background: #f3f4f6; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center; margin: 0 auto 4px; font-size: 11px; font-weight: 600; color: #9ca3af; }
    .step.done .step-num { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .step-line { flex: 1; height: 1px; background: #e5e5e5; }
    .step-label { font-size: 11px; color: #9ca3af; }
    .step.done .step-label { color: #4f46e5; }
    .drop-zone { border: 2px dashed #d1d5db; border-radius: 12px; padding: 2rem 1rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; margin-bottom: 1.25rem; }
    .drop-zone:hover { border-color: #4f46e5; background: #f5f3ff; }
    .drop-label { font-size: 14px; color: #6b7280; }
    .drop-label span { color: #4f46e5; font-weight: 500; }
    .file-types { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .file-chosen { display: none; align-items: center; gap: 10px; background: #f9fafb; border-radius: 10px; padding: 10px 14px; margin-bottom: 1.25rem; font-size: 14px; }
    .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #111; }
    .remove { cursor: pointer; color: #9ca3af; font-size: 20px; line-height: 1; }
    .remove:hover { color: #ef4444; }
    .btn { width: 100%; padding: 11px; background: #4f46e5; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    .btn:hover { background: #4338ca; }
    .btn:disabled { background: #d1d5db; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    </div>

    <div class="steps">
      <div class="step done" id="s1"><div class="step-num">1</div><div class="step-label">Chargement</div></div>
      <div class="step-line"></div>
      <div class="step" id="s2"><div class="step-num">2</div><div class="step-label">Traitement</div></div>
      <div class="step-line"></div>
      <div class="step" id="s3"><div class="step-num">3</div><div class="step-label">Téléchargement</div></div>
    </div>

    <h1>Convertir Excel en ZIP</h1>
    <p class="subtitle">Chargez votre fichier Excel et téléchargez automatiquement le résultat compressé.</p>

    <form id="uploadForm" action="/generate" method="POST" enctype="multipart/form-data">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5" style="margin:0 auto 12px;display:block"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p class="drop-label"><span>Cliquez pour choisir</span> ou glissez un fichier</p>
        <p class="file-types">.xlsx ou .xls</p>
        <input type="file" id="fileInput" name="excel_file" accept=".xlsx,.xls" style="display:none" required>
      </div>

      <div class="file-chosen" id="fileChosen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="fname" id="fileName"></span>
        <span class="remove" id="removeFile">×</span>
      </div>

      <button class="btn" id="submitBtn" type="submit" disabled>
        ⬇ Générer le ZIP
      </button>
    </form>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileChosen = document.getElementById('fileChosen');
    const dropZone = document.getElementById('dropZone');
    const fileName = document.getElementById('fileName');
    const submitBtn = document.getElementById('submitBtn');

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) {
        fileName.textContent = fileInput.files[0].name;
        fileChosen.style.display = 'flex';
        dropZone.style.display = 'none';
        submitBtn.disabled = false;
        document.getElementById('s1').classList.add('done');
      }
    });

    document.getElementById('removeFile').addEventListener('click', () => {
      fileInput.value = '';
      fileChosen.style.display = 'none';
      dropZone.style.display = 'block';
      submitBtn.disabled = true;
    });

    document.getElementById('uploadForm').addEventListener('submit', () => {
      document.getElementById('s2').classList.add('done');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Traitement en cours...';
    });
  </script>
</body>
</html>
